name: build-and-deploy
# Builds the agent Docker image and scans it for vulnerabilities on every push.
# Pushing to ECR and deploying to EKS is MANUAL (workflow_dispatch) only —
# see the note on the `on:` trigger below. We are local-first; there is no
# cluster yet, so automatic deploy only produced a failed job on every merge.
#
# Auth: assumes eaf-agent-ci-role in EAF-DEV via OIDC.
# The role is created in workloads/dev/iam.tf (Enterprise-Agent-Framework-Infra repo).

on:
  push:
    branches: ["**"]

permissions:
  id-token: write
  contents: read
  security-events: write   # for trivy SARIF upload

env:
  AWS_REGION: eu-west-2
  ECR_REGISTRY: 718438899462.dkr.ecr.eu-west-2.amazonaws.com
  ECR_REPOSITORY: eaf/agent
  EKS_CLUSTER: eaf-dev
  DEV_ACCOUNT_ID: "718438899462"

jobs:
  build-and-scan:
    name: build and scan
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      push: ${{ steps.check.outputs.push }}

    steps:
      - uses: actions/checkout@v4

      - name: check if this should push
        id: check
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: set image tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$TAG" >> "$GITHUB_OUTPUT"

      - name: build Docker image
        run: |
          docker build \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest \
            .

      # Table scan — blocks the build on fixable CRITICAL/HIGH CVEs.
      # Table format correctly applies ignore-unfixed; SARIF format does not.
      - name: scan image with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # only block on CVEs that have a fix available
          scanners: vuln
          exit-code: 1           # block the build

      # SARIF upload — reports all findings to GitHub Security tab (non-blocking).
      - name: generate trivy SARIF report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          exit-code: 0

      - name: upload trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  push-and-deploy:
    name: push and deploy
    needs: build-and-scan
    # Manual dispatch ONLY — never on a push. It assumes eaf-agent-ci-role and
    # deploys to the eaf-dev EKS cluster, neither of which currently exists, so
    # on a push this job failed at the first AWS step on every merge to main.
    # Re-enable automatic deploy by restoring `needs.build-and-scan.outputs.push`
    # here once the cluster and CI role are actually provisioned.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.DEV_ACCOUNT_ID }}:role/eaf-agent-ci-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: eaf-agent-ci-${{ github.run_id }}

      - name: login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: rebuild and push
        run: |
          docker build \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-scan.outputs.image_tag }} \
            --tag ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest \
            .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-scan.outputs.image_tag }}
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: deploy to EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

          # Apply all k8s manifests
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service-account.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

          # Deploy with the new image tag (rolling update, zero downtime)
          kubectl set image deployment/agent \
            agent=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-scan.outputs.image_tag }} \
            --namespace eaf

          # Wait for rollout to complete
          kubectl rollout status deployment/agent --namespace eaf --timeout=300s

      - name: summary
        run: |
          {
            echo "## Deployed to EKS dev"
            echo "Image: \`${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ needs.build-and-scan.outputs.image_tag }}\`"
            echo "Cluster: \`${{ env.EKS_CLUSTER }}\`"
          } >> "$GITHUB_STEP_SUMMARY"