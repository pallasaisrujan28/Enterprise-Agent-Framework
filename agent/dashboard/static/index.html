<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise Agent Framework</title>
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav id="sidebar">
    <div id="brand">Enterprise Agent Framework</div>
    <div id="nav">
      <a href="#overview" data-enabled="true">Overview</a>
    </div>
    <!--
      The chat lives in the dock on the right, not behind a nav entry, so a
      message can be sent while WATCHING the architecture it runs through. That
      is the whole reason the two are on screen together: the boxes in the chart
      are the stages the turn reports as it goes.
    -->
    <div id="dockhint" class="label">chat is docked on the right &rarr;</div>
  </nav>

  <main id="view">
    <p class="subtitle">loading…</p>
  </main>

  <aside id="dock">
    <header class="dockhead">
      <span class="dt">Chat</span>
      <button class="chip" id="modelchip" onclick="toggleModelMenu(event)"
              title="Switch the model for this conversation">…</button>
      <button class="iconbtn" id="dock-close" title="Collapse the chat">&rsaquo;</button>
    </header>

    <div class="sesshead">
      <button class="btn" onclick="newChat()">+ New chat</button>
      <button class="btn" id="statstoggle" onclick="toggleStats()"
              title="Show or hide the per-turn gate decision, tokens and timing">stats</button>
    </div>

    <div class="dock-resizer" id="dock-resizer" title="Drag to resize the chat"></div>

    <div class="chatlog" id="chatlog"></div>

    <div class="chatbar">
      <input id="chatmsg" placeholder="Ask something…" autocomplete="off"
             aria-label="Message the agent">
      <button class="btn btn-primary" id="chatsend">Send</button>
    </div>
  </aside>

  <button id="dock-reopen" class="btn btn-primary" title="Open the chat">&lsaquo; Chat</button>

  <!--
    Classic scripts sharing one global scope, loaded in dependency order.
    main.js runs the bootstrap and must load LAST.
    No modules, no bundler, no framework — the dashboard should run with
    nothing installed.
  -->
  <script src="/js/util.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/diagram.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/views.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
