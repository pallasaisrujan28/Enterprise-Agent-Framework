apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: eaf
spec:
  selector:
    app: agent
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
  # ClusterIP: internal only. Other pods call http://agent-service/
  # External traffic comes through the Ingress (not yet built — needs AWS LB Controller)
