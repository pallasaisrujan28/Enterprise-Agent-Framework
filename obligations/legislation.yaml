# Obligation policy for the legislation domain.
#
# This is the ENFORCEMENT half of what used to live in
# skills/legislation_advice.md. The skill still teaches the procedure; this file
# is what the obligation gate holds the answer to. Split so a third-party skill
# can be installed without carrying (or dodging) obligations, and so a governed
# domain is enforced whether or not a matching skill happens to be installed.
#
# description: the router reads this to decide whether the legislation domain
#              applies to a given question — it need not mention any skill.
# obligations: checked by agent/gate.py against the finished answer.

# NARROWED so the router only fires on genuine statutory-interpretation
# questions, and EASED so it stops over-blocking:
#   - description excludes fees/costs/how-to/eligibility/gov.uk guidance, which
#     were being misclassified as legislation (e.g. "UK visa fee for 3 years").
#   - must_cite no longer demands version-pinning (a legislation.gov.uk source is
#     enough); version-pinning is a refinement we can restore once the model
#     returns structured citations.
#   - must_ask_when_missing is OBSERVE, not enforce: the gate infers fields from
#     prose and cannot yet extract `as_at_date`, so enforcing it blocked every
#     substantive answer. Recorded for visibility until structured responses land.
name: legislation
description: >
  Statutory interpretation of a specific UK Act or Statutory Instrument — what it
  says, requires, or prohibits. NOT fees, costs, how-to, eligibility, or guidance.
obligations:
  - must_cite: {contains: legislation.gov.uk, min_count: 1}
  - must_ask_when_missing: {fields: [as_at_date], mode: observe}
  - must_disclose: {when: unapplied_effects_exist, disclose: unapplied_effects}
