# SearXNG configuration for local development.
#
# TWO SETTINGS HERE ARE LOAD-BEARING and both default the wrong way for an agent:
#
#   formats must include json. SearXNG serves HTML only by default, so
#   agent/tools/web_search.py — which asks for format=json — gets a 403 that
#   reads like a permissions problem rather than a missing feature.
#
#   limiter must be false. With it on, the bot-detection middleware rate-limits
#   a tool calling in a loop and returns 429s that look exactly like the upstream
#   engines throttling us.
#
# Both were found the hard way. Neither is a secret and neither is safe to carry
# into a shared deployment: this file binds to a loopback-only container and is
# for a developer machine.

use_default_settings: true

general:
  debug: false
  instance_name: "EAF local search"
  # No usage stats endpoint — nothing consumes it and it is one less surface.
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  # THE setting that makes the JSON API work at all.
  formats:
    - html
    - json

server:
  # Overridden by SEARXNG_SECRET in docker-compose.yml. Present because SearXNG
  # refuses to start without a value here.
  secret_key: "local-development-only-not-a-secret"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

ui:
  static_use_hash: true

# Engine set chosen for RELIABILITY on a self-hosted instance, not breadth.
#
# The trap we hit: google and duckduckgo CAPTCHA-block a datacenter/local
# SearXNG almost immediately ("Suspended: CAPTCHA" in the engine errors), so a
# query that leaned on them — especially `site:` filters, which those two serve
# best — came back with ZERO results and read to the agent as "search is down".
#
# So google is DROPPED (it effectively never answers from here) and the set is
# widened to engines that answer without a CAPTCHA wall from a server IP:
#   bing        — reliable, the workhorse
#   brave       — strong independent-ish general index, rarely blocks
#   mojeek      — its OWN crawler/index, no CAPTCHA, great fallback
#   duckduckgo  — kept as a bonus; when it works it handles site: well, and it
#                 no longer being the ONLY site:-capable engine means its
#                 CAPTCHA no longer zeroes a query
#   wikipedia   — reference/definitional queries
#
# More engines = more latency per query, but SearXNG returns as each responds and
# a broader set is what stops the intermittent empty results.
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: mojeek
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: wikipedia
    disabled: false
  - name: google
    disabled: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
