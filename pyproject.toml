[project]
name = "agent"
version = "0.0.1"
description = "Enterprise Agent Framework — agentic AI system with obligation gate, semantic tool registry, and context engineering."
requires-python = ">=3.11"

# Lower bounds only — uv resolves exact versions into uv.lock.
# To add a dependency: `uv add <package>` (updates both this file and uv.lock).
# To update: `uv lock --upgrade-package <package>`.
# Never edit uv.lock by hand; never pin exact versions here.
dependencies = [
    "PyYAML>=6.0",
    # LangGraph + LangChain-AWS: ReAct agent graph and Bedrock inference
    "langgraph>=0.4",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
    # AWS SDK — IRSA auth, no static credentials
    "boto3>=1.35",
    # Tool backends
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "numpy>=1.26",
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]

[project.scripts]
agent = "agent.__main__:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["UP031", "UP032"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.mypy]
# Third-party packages without type stubs (boto3, qdrant-client, langchain_aws,
# etc.) are excluded from strict import checking. Remove per-package once stubs
# are available or the package ships py.typed.
ignore_missing_imports = true
