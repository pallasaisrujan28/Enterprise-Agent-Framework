[project]
name = "agent"
version = "0.0.1"
description = "Enterprise Agent Framework — an agent whose behaviour is bound by published rules, not only by the model's own knowledge."
requires-python = ">=3.11"

# Upper bounds on every dependency, deliberately. An unbounded `>=` is how a
# supply-chain compromise or a breaking minor arrives without a review.
dependencies = [
    "PyYAML>=6.0.2,<7",
    # Promoted from the optional `bedrock` extra. The default provider IS Bedrock,
    # so a default install that cannot run a turn is not a smaller install, it is
    # a broken one — and the Dockerfile runs `uv sync --frozen --no-dev`, which
    # never installed an extra, so the container could not have answered a
    # message.
    #
    # The reason the extra existed still holds and is now met differently: the
    # obligation layer is developed and tested with NO AWS account and no
    # credentials, against agent/models/echo.py, and boto3 is imported inside
    # BedrockModel.__init__ rather than at module scope — so nothing pays for it
    # until a Bedrock model is actually constructed.
    "boto3>=1.35.0,<2",
]

[project.optional-dependencies]
dev = [
    # Crossing the major bound deliberately: PYSEC-2026-1845 affects pytest 8.x
    # and is only fixed in 9.0.3, so no lock move inside `<9` can resolve it.
    # Reviewed: our usage is fixtures + raises only, nothing 9.x changed.
    "pytest>=9.0.3,<10",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.13.0,<2",
    "types-PyYAML>=6.0.12,<7",
    "pip-audit>=2.7.3,<3",
]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter owns line length. Keeping E501 on as well makes the two tools
# disagree on lines the formatter cannot split, and the fight is unwinnable.
ignore = ["E501"]

# scripts/ runs under the SYSTEM python, which may be older than the package
# target. Modernisation rules that assume 3.11+ syntax would break it.
[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["UP031", "UP032"]

[tool.pytest.ini_options]
# `test/` not `tests/`, matching the ai-chat-infrastructure layout.
testpaths = ["test"]
# No addopts — the Makefile owns verbosity, so `make test` and CI agree.

[tool.mypy]
ignore_missing_imports = true
