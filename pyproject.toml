[project]
name = "agent"
version = "0.0.1"
description = "Enterprise Agent Framework — deepagents harness with EAF-specific tools, memory, and guardrails."
requires-python = ">=3.11"

# Lower bounds only — uv resolves exact versions into uv.lock.
# To add: `uv add <package>`  To update: `uv lock --upgrade-package <package>`
# Never edit uv.lock by hand.
dependencies = [
    "PyYAML>=6.0",
    # deepagents harness — brings LangGraph and LangChain with it.
    #
    # The [aws] EXTRA is required and was missing. langchain-aws is declared by
    # deepagents as `extra == "aws"`, not as a base dependency, so a plain
    # `deepagents>=0.7` install has no ChatBedrockConverse — and agent/model.py,
    # agent/brain.py and agent/__main__.py all import it. The whole harness,
    # including the FastAPI service the Dockerfile runs as its CMD, failed at
    # import with "No module named 'langchain_aws'".
    "deepagents[aws]>=0.7",
    # Bedrock inference (IRSA auth, no stored credentials)
    "boto3>=1.35",
    # Tool backends
    "qdrant-client>=1.9",
    "httpx>=0.27",
    "numpy>=1.26",
    # API server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Static page extraction for the `direct` fetch backend — clean article
    # markdown from raw HTML with no browser and no service. See
    # agent/tools/fetch_backend.py for why this exists alongside Firecrawl.
    "trafilatura>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "pip-audit>=2.7",
]

[project.scripts]
# Points at the CLI, not at `agent.__main__:app`. A console script is called with
# no arguments, and `app` is a FastAPI instance whose __call__ is the three-argument
# ASGI signature — so `agent` raised TypeError rather than doing anything.
#
# Nothing is lost by the change: the HTTP service still starts with
# `python -m agent` (which is what the Dockerfile's CMD uses), and `agent
# dashboard` now works, which is the only thing a console script here can
# usefully do.
agent = "agent.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["UP031", "UP032"]

[tool.pytest.ini_options]
testpaths = ["test"]
# No addopts — the Makefile owns verbosity, so `make test` and CI agree.

[tool.mypy]
ignore_missing_imports = true
